<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Consultas - Garantías</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: var(--primary); border-left: 5px solid var(--accent); padding-left: 15px; margin-bottom: 25px; }
        
        .upload-section { border: 2px dashed var(--accent); padding: 30px; text-align: center; border-radius: 10px; background: #ebf5fb; transition: 0.3s; margin-bottom: 20px; }
        .upload-section:hover { background: #d6eaf8; }
        
        #search-input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; display: none; font-size: 16px; }
        
        .table-wrapper { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 15px; text-align: left; position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background-color: #f9f9f9; }
        
        .stats { display: none; gap: 15px; margin-bottom: 20px; }
        .card { background: var(--primary); color: white; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Intérprete de Datos de Garantías</h2>
    
    <div class="stats" id="stats-panel">
        <div class="card">Registros: <span id="row-count">0</span></div>
        <div class="card" style="background: var(--accent);">Columnas: <span id="col-count">0</span></div>
    </div>

    <div class="upload-section" id="drop-zone">
        <p>Selecciona o arrastra tu archivo de Excel (.xlsx)</p>
        <input type="file" id="excel-file" accept=".xlsx, .xls">
    </div>

    <input type="text" id="search-input" placeholder="🔍 Buscar por ticket, modelo, serie o técnico...">
    
    <div id="output" class="table-wrapper"></div>
</div>

<script>
    let rawData = [];

    document.getElementById('excel-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            rawData = XLSX.utils.sheet_to_json(sheet);
            
            document.getElementById('search-input').style.display = 'block';
            document.getElementById('stats-panel').style.display = 'flex';
            renderTable(rawData);
        };
        reader.readAsArrayBuffer(file);
    });

    function renderTable(data) {
        if (data.length === 0) {
            document.getElementById('output').innerHTML = "<p style='padding:20px;'>No hay datos para mostrar.</p>";
            return;
        }

        document.getElementById('row-count').innerText = data.length;
        document.getElementById('col-count').innerText = Object.keys(data[0]).length;

        let html = '<table><thead><tr>';
        Object.keys(data[0]).forEach(key => html += `<th>${key}</th>`);
        html += '</tr></thead><tbody>';

        data.forEach(row => {
            html += '<tr>';
            Object.values(row).forEach(val => html += `<td>${val || ''}</td>`);
            html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('output').innerHTML = html;
    }

    // Buscador en tiempo real
    document.getElementById('search-input').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const filtered = rawData.filter(row => 
            Object.values(row).some(val => String(val).toLowerCase().includes(term))
        );
        renderTable(filtered);
    });
</script>

</body>
</html>
