<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Soporte Técnico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 25px; border-radius: 12px; shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: none; font-weight: bold; color: #7f8c8d; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Stats Cards */
        .grid-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .chart-container { background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 8px; height: 300px; }
        
        .upload-section { border: 2px dashed var(--accent); padding: 20px; text-align: center; border-radius: 10px; background: #ebf5fb; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { background: var(--primary); color: white; padding: 10px; text-align: left; position: sticky; top: 0; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        #search-input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel Técnico de Garantías y Soporte</h2>

    <div class="upload-section">
        <input type="file" id="excel-file" accept=".xlsx, .xls">
        <p style="font-size: 12px; color: #666;">Sube el archivo de Odoo para procesar estadísticas</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('data-tab')">Listado de Tickets</button>
        <button class="tab-btn" onclick="openTab('stats-tab')">Análisis Estadístico</button>
    </div>

    <div id="data-tab" class="tab-content active">
        <input type="text" id="search-input" placeholder="Filtrar por técnico, serie, modelo o ticket...">
        <div style="overflow-x: auto; max-height: 500px;">
            <div id="table-output"></div>
        </div>
    </div>

    <div id="stats-tab" class="tab-content">
        <div class="grid-charts">
            <div class="chart-container"><canvas id="chart-tecnicos"></canvas></div>
            <div class="chart-container"><canvas id="chart-estados"></canvas></div>
            <div class="chart-container"><canvas id="chart-fallas"></canvas></div>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let charts = {};

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    document.getElementById('excel-file').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            rawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            renderTable(rawData);
            renderCharts(rawData);
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    });

    function renderTable(data) {
        let html = '<table><thead><tr>';
        if(data.length > 0) {
            Object.keys(data[0]).forEach(k => html += `<th>${k}</th>`);
            html += '</tr></thead><tbody>';
            data.forEach(row => {
                html += '<tr>';
                Object.values(row).forEach(v => html += `<td>${v || ''}</td>`);
                html += '</tr>';
            });
        }
        html += '</tbody></table>';
        document.getElementById('table-output').innerHTML = html;
    }

    function renderCharts(data) {
        // Destruir charts previos si existen
        Object.values(charts).forEach(c => c.destroy());

        const counts = (key) => data.reduce((acc, row) => {
            let val = row[key] || 'No definido';
            acc[val] = (acc[val] || 0) + 1;
            return acc;
        }, {});

        // Ajusta los nombres de las llaves abajo según las columnas exactas de tu Excel de Odoo
        const tecData = counts('Persona asignada') || counts('Técnico');
        const estData = counts('Etapa') || counts('Estado');

        charts.tec = new Chart(document.getElementById('chart-tecnicos'), {
            type: 'bar',
            data: { labels: Object.keys(tecData), datasets: [{ label: 'Tickets por Técnico', data: Object.values(tecData), backgroundColor: '#3498db' }] },
            options: { maintainAspectRatio: false }
        });

        charts.est = new Chart(document.getElementById('chart-estados'), {
            type: 'doughnut',
            data: { labels: Object.keys(estData), datasets: [{ data: Object.values(estData), backgroundColor: ['#2ecc71','#f1c40f','#e74c3c','#9b59b6'] }] },
            options: { maintainAspectRatio: false, plugins: { title: { display: true, text: 'Estado de Tickets' } } }
        });
    }

    document.getElementById('search-input').addEventListener('input', function(e) {
        const term = e.target.value.toLowerCase();
        const filtered = rawData.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(term)));
        renderTable(filtered);
    });
</script>
</body>
</html>
